name: iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      flutter-version:
        description: 'Flutter SDK 版本'
        required: false
        default: '3.47.7'
  push:
    branches:
      - feat/ios-unsigned-ipa
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'packages/**'
      - 'core/doh_proxy/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tool/**'
      - '.github/workflows/ios-unsigned-ipa.yaml'

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version || '3.47.7' }}
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: ios-unsigned

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Exercise share link and export behavior
        run: |
          plutil -lint ios/Runner.xcodeproj/project.pbxproj ios/ShareExtension/Info.plist ios/ShareExtension/ShareExtension.entitlements
          swiftc ios/Shared/ShareSessionStore.swift ios/ShareExtension/ForumShareClient.swift tool/ios_share_extension_smoke.swift -o "$RUNNER_TEMP/share-extension-smoke"
          "$RUNNER_TEMP/share-extension-smoke"

      - name: Cache iOS engine artifacts
        run: flutter precache --ios

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Resolve version
        id: version
        run: |
          version=$(sed -n 's/^version: //p' pubspec.yaml | cut -d+ -f1)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build unsigned IPA
        run: dart tool/build_ipa_nosign.dart "${{ steps.version.outputs.value }}" -y

      - name: Verify native DOH library
        run: |
          test -f build/ios/iphoneos/Runner.app/Runner
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep "_doh_proxy_start_with_config_json"

      - name: Verify share extension packaging
        run: |
          app=build/ios/iphoneos/Runner.app
          extension="$app/PlugIns/ShareExtension.appex"
          test -f "$extension/ShareExtension"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$extension/Info.plist")" = com.apple.share-services
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$extension/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$extension/Info.plist")" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          file "$extension/ShareExtension"
          python3 - <<'PY'
          import pathlib, zipfile
          for ipa in pathlib.Path('build/ios/ipa').glob('*.ipa'):
              with zipfile.ZipFile(ipa) as archive:
                  member = 'Payload/Runner.app/PlugIns/ShareExtension.appex/ShareExtension'
                  assert archive.getinfo(member).file_size > 0, 'IPA 缺少分享扩展可执行文件'
                  print(f'{ipa.name}: 分享扩展已打包')
          PY

      - name: Generate checksum
        run: |
          cd build/ios/ipa
          shasum -a 256 ./*.ipa | tee SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-unsigned-ipa
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
